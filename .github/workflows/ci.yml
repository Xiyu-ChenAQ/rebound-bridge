name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix install

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python build tools
        run: python -m pip install build pytest

      - name: Build Python source distribution
        run: python -m build --sdist

      - name: Check paper sources in source distribution
        run: >-
          python -c "import pathlib, subprocess, sys;
          source, = pathlib.Path('dist').glob('*.tar.gz');
          subprocess.check_call([sys.executable, 'tests/paper/checks/check_paper_sdist.py', str(source)])"

      - name: Build wheel from source distribution
        run: >-
          python -c "import pathlib, subprocess, sys;
          source, = pathlib.Path('dist').glob('*.tar.gz');
          subprocess.check_call([sys.executable, '-m', 'pip', 'wheel', '--no-deps', '--wheel-dir', 'dist', str(source)])"

      - name: Install built wheel
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel, = pathlib.Path('dist').glob('*.whl');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel)])"

      - name: Verify installed package import
        run: >-
          python -c "import pathlib, rebound_bridge;
          module = pathlib.Path(rebound_bridge.__file__).resolve();
          print(module);
          assert 'site-packages' in module.parts, 'Tests must use the installed wheel'"

      - name: Install paper analysis dependencies
        run: python -m pip install -r tests/paper/requirements.txt

      - name: Test paper analysis scripts
        run: python tests/paper/run_all.py --unit-tests-only

      - name: Configure paper programs
        run: cmake -S tests/paper -B build/paper

      - name: Build paper programs
        run: cmake --build build/paper --config Release

      - name: Test paper limiting cases
        run: ctest --test-dir build/paper -C Release --output-on-failure

      - name: Run short paper experiments
        run: python tests/paper/run_all.py --mode smoke --skip-build --build-dir build/paper --output-dir build/paper-smoke
